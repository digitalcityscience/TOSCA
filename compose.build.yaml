# Adds `build:` to the three TOSCA images, for building them from source
# instead of pulling a release. Used by `make build-local`.
#
# The sources are the component checkouts: ./components/<repo> after
# `make dev-setup`, or wherever BACKEND_SRC / FRONTEND_SRC / GEOSERVER_SRC point.
# The Dockerfiles and build arguments are the ones the release workflows use.

services:
  django: &backend-build
    build:
      context: ${BACKEND_SRC:-./components/TOSCA-Backend}
      dockerfile: docker/django/Dockerfile.prod
      args:
        VERSION: ${BACKEND_BUILD_VERSION:-dev}
        REVISION: ${BACKEND_BUILD_REVISION:-unknown}

  migrate: *backend-build
  storage-init: *backend-build

  web:
    build:
      context: ${FRONTEND_SRC:-./components/TOSCA-Frontend}
      dockerfile: Dockerfile
      args:
        VERSION: ${FRONTEND_BUILD_VERSION:-dev}
        REVISION: ${FRONTEND_BUILD_REVISION:-unknown}

  geoserver:
    build:
      context: ${GEOSERVER_SRC:-./components/geoserver_docker}
      dockerfile: docker/Dockerfile
      args:
        VERSION: ${GEOSERVER_BUILD_VERSION:-dev}
        REVISION: ${GEOSERVER_BUILD_REVISION:-unknown}
